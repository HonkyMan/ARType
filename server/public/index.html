<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>ARType · Workspace</title><link rel="icon" href="/assets/artype-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<div id="app"><div class="loading" role="status">Connecting to your workspace…</div></div>
<div id="toast" role="status" hidden></div>
<dialog id="discard-dialog" aria-labelledby="discard-title" aria-describedby="discard-description">
  <form method="dialog">
    <h2 id="discard-title">You have unsaved changes</h2>
    <p id="discard-description">Save your form before leaving or discard the changes.</p>
    <div class="actions">
      <button value="cancel" autofocus>Continue editing</button>
      <button value="discard" class="quiet danger">Leave without saving</button>
    </div>
  </form>
</dialog>
</body></html>
