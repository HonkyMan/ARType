name: artype
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: artype
      POSTGRES_USER: artype
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U artype]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      options: {max-size: 10m, max-file: '3'}
  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://artype:${POSTGRES_PASSWORD}@db:5432/artype
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS in .env}
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}
      PROVIDER_KEYS: ${PROVIDER_KEYS:-\{\}}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-google/gemma-3-4b-it}
      TRUST_PROXY: '1'
      DOWNLOADS_DIRECTORY: /app/downloads
    volumes: ['./releases:/app/downloads:ro']
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: 10m, max-file: '3'}
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options: {max-size: 10m, max-file: '3'}
volumes:
  postgres:
  caddy_data:
  caddy_config:
